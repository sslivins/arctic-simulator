<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arctic Heat Pump Simulator</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; padding: 16px; max-width: 800px; margin: 0 auto; }
h1 { color: #64b5f6; font-size: 1.4em; margin-bottom: 12px; }
h2 { color: #90caf9; font-size: 1.1em; margin: 16px 0 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
.card { background: #16213e; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
.status-bar { display: flex; gap: 16px; flex-wrap: wrap; font-size: 0.85em; }
.status-bar .item { display: flex; align-items: center; gap: 4px; }
.status-bar .dot { width: 8px; height: 8px; border-radius: 50%; }
.dot.on { background: #4caf50; }
.dot.off { background: #666; }

/* Controller command display (read-only) */
.cmd-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.cmd-item { padding: 8px 10px; background: #1a1a2e; border-radius: 6px; font-size: 0.85em; }
.cmd-item .cmd-label { color: #888; font-size: 0.75em; text-transform: uppercase; margin-bottom: 2px; }
.cmd-item .cmd-value { color: #90caf9; font-size: 1em; font-weight: 500; }
.cmd-item .cmd-value.on { color: #4caf50; }
.cmd-item .cmd-value.off { color: #666; }

/* Error inject buttons */
/* Error groups */
.err-group { margin-bottom: 10px; }
.err-group-label { font-size: 0.75em; color: #888; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; padding-left: 2px; }
.err-group-btns { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 6px; }
.err-group-btns button { padding: 6px 4px; border: 1px solid #ef5350; border-radius: 5px; background: #1a1a2e; color: #ef5350; cursor: pointer; font-size: 0.8em; transition: all 0.15s; }
.err-group-btns button:hover { background: #4a1a1a; }
.err-group-btns button.active { background: #c62828; color: #fff; }

/* Toggles */
.toggles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.toggle { display: flex; align-items: center; justify-content: space-between; padding: 6px 10px; background: #1a1a2e; border-radius: 4px; font-size: 0.85em; }
.toggle label { cursor: pointer; user-select: none; }
.switch { position: relative; width: 36px; height: 20px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider { position: absolute; cursor: pointer; inset: 0; background: #444; border-radius: 20px; transition: 0.2s; }
.slider::before { content: ""; position: absolute; height: 14px; width: 14px; left: 3px; bottom: 3px; background: #ccc; border-radius: 50%; transition: 0.2s; }
.switch input:checked + .slider { background: #4caf50; }
.switch input:checked + .slider::before { transform: translateX(16px); background: #fff; }

/* Value inputs */
.values { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 8px; }
.val-row { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; background: #1a1a2e; border-radius: 4px; font-size: 0.85em; }
.val-row input { width: 70px; padding: 4px 6px; background: #0f3460; border: 1px solid #444; border-radius: 4px; color: #e0e0e0; text-align: right; font-size: 0.85em; }
.val-row input:focus { outline: none; border-color: #64b5f6; }
.val-row .unit { color: #888; font-size: 0.8em; margin-left: 4px; width: 30px; }

/* Segmented control (fan speed) */
.seg-row { display: flex; align-items: center; gap: 10px; padding: 6px 10px; background: #1a1a2e; border-radius: 4px; font-size: 0.85em; }
.seg-row .seg-label { color: #e0e0e0; white-space: nowrap; }
.seg-group { display: flex; border: 1px solid #444; border-radius: 5px; overflow: hidden; }
.seg-group button { padding: 5px 12px; border: none; border-right: 1px solid #444; background: #16213e; color: #888; cursor: pointer; font-size: 0.8em; transition: all 0.15s; }
.seg-group button:last-child { border-right: none; }
.seg-group button:hover { background: #2a3a5e; color: #e0e0e0; }
.seg-group button.active { background: #1565c0; color: #fff; }

/* Playback */
.playback-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.playback-controls button { padding: 6px 14px; border: 1px solid #444; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; cursor: pointer; font-size: 0.85em; }
.playback-controls button:hover { background: #2a3a5e; }
.playback-controls .state { font-size: 0.85em; color: #90caf9; }
.file-pick { padding: 6px 14px; border: 1px solid #444; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; cursor: pointer; font-size: 0.85em; }
.file-pick:hover { background: #2a3a5e; }
.file-pick input[type=file] { display: none; }
textarea { width: 100%; height: 80px; margin-top: 8px; padding: 8px; background: #0f3460; border: 1px solid #444; border-radius: 4px; color: #e0e0e0; font-family: monospace; font-size: 0.8em; resize: vertical; }

/* Errors */
.error-section { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.error-section button { padding: 6px 14px; border: 1px solid #ef5350; border-radius: 4px; background: #1a1a2e; color: #ef5350; cursor: pointer; }
.error-section button:hover { background: #4a1a1a; }
.error-flags { font-size: 0.85em; color: #ef5350; }
.error-flags.none { color: #4caf50; }

/* Modbus stats */
.stats { display: flex; gap: 16px; font-size: 0.85em; color: #888; }

/* Recorder / Stream */
.rec-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.rec-controls button { padding: 6px 14px; border: 1px solid #444; border-radius: 4px; background: #1a1a2e; color: #e0e0e0; cursor: pointer; font-size: 0.85em; }
.rec-controls button:hover { background: #2a3a5e; }
.rec-controls button.recording { border-color: #ef5350; color: #ef5350; animation: rec-pulse 1s infinite; }
@keyframes rec-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
.rec-info { font-size: 0.85em; color: #888; margin-top: 6px; }
.rec-info span { color: #90caf9; }

/* Toast */
.toast { position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 6px; color: #fff; font-size: 0.85em; opacity: 0; transition: opacity 0.3s; z-index: 100; }
.toast.show { opacity: 1; }
.toast.ok { background: #2e7d32; }
.toast.err { background: #c62828; }
</style>
</head>
<body>

<h1>🧊 Arctic Heat Pump Simulator</h1>

<!-- Status -->
<div class="card">
  <div class="status-bar">
    <div class="item"><span class="dot" id="dot-tuya"></span> Tuya</div>
    <div class="item"><span class="dot" id="dot-wifi"></span> WiFi</div>
    <div class="item" id="version-info"></div>
  </div>
  <div class="stats" id="tuya-stats"></div>
</div>

<!-- Setpoints (normally written by the controller over fc=0x06) -->
<h2>Setpoints</h2>
<div class="card">
  <div class="cmd-grid" id="cmd-display"></div>
</div>

<!-- Run flags, working mode, direction, presets -->
<h2>System Status</h2>
<div class="card">
  <div class="toggles" id="status-toggles"></div>
  <div id="mode-control" style="margin-top:8px"></div>
</div>

<!-- Temperatures & Sensors -->
<h2>Temperatures & Sensors</h2>
<div class="card">
  <div class="values" id="temp-values"></div>
</div>

<!-- Electrical -->
<h2>Electrical / Mechanical</h2>
<div class="card">
  <div class="values" id="elec-values"></div>
</div>

<!-- Errors -->
<h2>Errors</h2>
<div class="card">
  <div class="error-section">
    <button onclick="clearErrors()">Clear All Errors</button>
    <span class="error-flags none" id="error-display">No errors</span>
  </div>
  <div id="error-groups" style="margin-top:10px"></div>
</div>

<!-- Playback -->
<h2>Playback</h2>
<div class="card">
  <div class="playback-controls">
    <button id="play-btn" onclick="togglePlayback()" disabled>▶ Play</button>
    <button id="stop-btn" onclick="stopPlayback()" disabled>⏹ Stop</button>
    <label class="file-pick"><input type="file" id="capture-file" accept=".jsonl,.json,.txt" onchange="onCaptureFile(this)"> � Open Capture</label>
    <span class="state" id="playback-state">idle</span>
  </div>
  <div class="rec-info" id="playback-info">Load a JSONL capture file to replay register values</div>
</div>

<!-- System -->
<h2>System</h2>
<div class="card">
  <div style="display:flex;gap:8px;align-items:center">
    <button onclick="rebootDevice()" style="padding:6px 14px;border:1px solid #ef5350;border-radius:4px;background:#1a1a2e;color:#ef5350;cursor:pointer;font-size:0.85em">⟳ Reboot Device</button>
  </div>
</div>

<!-- Stream (SSE — works on all devices, no PSRAM needed) -->
<h2>Stream</h2>
<div class="card">
  <div class="rec-controls">
    <button id="stream-toggle" onclick="toggleStream()">📡 Stream</button>
    <button onclick="downloadStreamData()">💾 Download</button>
    <button onclick="clearStreamData()">🗑 Clear</button>
  </div>
  <div class="rec-info" id="stream-info">Stream register data in real-time to your browser</div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = '';

// ============================================================================
// Everything below is generated from the simulator's semantic API, which is
// the arctic-macon library's catalog: GET /api/fields, /api/state and
// /api/faults/catalog. The page carries no register numbers or bit maps.
// ============================================================================
let FIELDS = [];          // /api/fields
let FAULTS = [];          // /api/faults/catalog
let currentState = null;  // /api/state
const PRESETS = ['idle', 'heating', 'cooling', 'hot_water', 'defrost', 'fault_p01'];

const TITLES = {
  cooling_setpoint: 'Cooling SP', heating_setpoint: 'Heating SP',
  hot_water_setpoint: 'Hot Water SP', hot_water_ceiling: 'Hot Water Ceiling',
};
function title(name) {
  return TITLES[name] || name.replace(/_temp$/, '').replace(/_/g, ' ')
    .replace(/\b\w/g, c => c.toUpperCase());
}
const isSetpoint = f => /setpoint|ceiling/.test(f.name);
const isTemp = f => /_temp$/.test(f.name);

async function patchState(obj) {
  try {
    const r = await fetch(BASE + '/api/state', {
      method: 'PATCH', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(obj)
    });
    const body = await r.json();
    if (!r.ok) { toast(body.error || 'Rejected', true); refresh(); return; }
    currentState = body;
    updateUI();
  } catch(e) { toast('Error: ' + e.message, true); }
}

function numberRow(f) {
  const unverified = f.verified ? '' : ' <span class="unit" title="Mapping not verified on real hardware">(unverified)</span>';
  return `<div class="val-row">
    <span>${title(f.name)}${unverified}</span>
    <div><input type="number" id="fld-${f.name}" min="${f.min}" max="${f.max}" step="${f.step}"
      onchange="patchState({'${f.name}': Math.round(parseFloat(this.value))})"
      ><span class="unit">${f.unit || ''}</span></div>
  </div>`;
}

function renderControls() {
  const nums = FIELDS.filter(f => f.kind === 'number');
  document.getElementById('cmd-display').innerHTML =
    '<div class="values">' + nums.filter(isSetpoint).map(numberRow).join('') + '</div>';
  document.getElementById('temp-values').innerHTML =
    nums.filter(f => isTemp(f) && !isSetpoint(f)).map(numberRow).join('');
  document.getElementById('elec-values').innerHTML =
    nums.filter(f => !isTemp(f) && !isSetpoint(f)).map(numberRow).join('');

  document.getElementById('status-toggles').innerHTML = FIELDS.filter(f => f.kind === 'flag').map(f =>
    `<div class="toggle">
      <label for="fld-${f.name}">${title(f.name)}</label>
      <label class="switch"><input type="checkbox" id="fld-${f.name}"
        onchange="patchState({'${f.name}': this.checked})"><span class="slider"></span></label>
    </div>`).join('');

  const enums = FIELDS.filter(f => f.options);
  document.getElementById('mode-control').innerHTML = enums.map(f =>
    `<div class="seg-row"><span class="seg-label">${title(f.name)}</span><div class="seg-group">` +
    f.options.map(o => `<button data-${f.name}="${o}" onclick="patchState({'${f.name}': '${o}'})">${title(o)}</button>`).join('') +
    '</div></div>').join('') +
    '<div class="seg-row"><span class="seg-label">Preset</span><div class="seg-group">' +
    PRESETS.map(p => `<button onclick="loadPreset('${p}')">${title(p)}</button>`).join('') + '</div></div>';

  document.getElementById('error-groups').innerHTML = ['critical', 'error', 'warning'].map(sev => {
    const list = FAULTS.filter(f => f.severity === sev);
    if (!list.length) return '';
    const btns = list.flatMap(f => f.sites.map(s =>
      `<button data-site="${s.site}" onclick="toggleSite(${s.site})" title="${s.label}">${f.code}${f.sites.length > 1 ? ' · ' + s.label : ''}</button>`
    )).join('');
    return `<div class="err-group"><div class="err-group-label">${title(sev)}</div><div class="err-group-btns">${btns}</div></div>`;
  }).join('');
}

async function loadPreset(name) {
  try {
    const r = await fetch(BASE + '/api/preset', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ name })
    });
    toast(r.ok ? 'Preset ' + title(name) : 'Preset failed', !r.ok);
    refresh();
  } catch(e) { toast('Error: ' + e.message, true); }
}

async function toggleSite(site) {
  const active = (currentState?.faults || []).some(f => f.site === site);
  try {
    const r = await fetch(BASE + '/api/faults', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ site, active: !active })
    });
    if (!r.ok) toast('Fault injection failed', true);
    refresh();
  } catch(e) { toast('Error: ' + e.message, true); }
}

async function loadCatalog() {
  try {
    const [f, c] = await Promise.all([fetch(BASE + '/api/fields'), fetch(BASE + '/api/faults/catalog')]);
    FIELDS = (await f.json()).fields;
    FAULTS = (await c.json()).faults;
    renderControls();
  } catch(e) { toast('Failed to load catalog', true); }
}

async function refresh() {
  try {
    const statusResp = await fetch(BASE + '/api/status');
    if (statusResp.ok) {
      const s = await statusResp.json();
      document.getElementById('dot-tuya').className = 'dot ' + (s.tuya_active ? 'on' : 'off');
      document.getElementById('dot-wifi').className = 'dot on';
      document.getElementById('version-info').textContent = 'v' + s.version +
        (s.macon ? ` · macon ${s.macon.layout_fingerprint}` : '');
      document.getElementById('tuya-stats').textContent =
        `Frames: ${s.tuya_stats.frames_seen}  Req: ${s.tuya_stats.requests_handled}  Resp: ${s.tuya_stats.responses_sent}  Errors: ${s.tuya_stats.parse_errors}`;
      // Don't overwrite playback state when browser has a capture loaded
      if (!pbTimer && pbEntries.length === 0) {
        document.getElementById('playback-state').textContent =
          `${s.playback.state} (${s.playback.position}/${s.playback.entries})`;
      }
    }
    const st = await fetch(BASE + '/api/state');
    if (st.ok) { currentState = await st.json(); updateUI(); }
  } catch(e) {
    document.getElementById('dot-wifi').className = 'dot off';
  }
}

function updateUI() {
  if (!currentState) return;
  const v = currentState.fields;
  FIELDS.forEach(f => {
    const el = document.getElementById('fld-' + f.name);
    if (el && document.activeElement !== el) {
      if (f.kind === 'flag') el.checked = !!v[f.name];
      else if (f.kind === 'number') el.value = v[f.name] ?? '';
    }
    if (f.options) f.options.forEach(o => {
      const b = document.querySelector(`[data-${f.name}="${o}"]`);
      if (b) b.classList.toggle('active', v[f.name] === o);
    });
  });

  const faults = currentState.faults || [];
  const errEl = document.getElementById('error-display');
  if (faults.length) {
    errEl.textContent = faults.map(f => `${f.code} ${f.label}`).join(', ');
    errEl.className = 'error-flags';
  } else {
    errEl.textContent = `No errors · ${currentState.operation}`;
    errEl.className = 'error-flags none';
  }
  document.querySelectorAll('[data-site]').forEach(b =>
    b.classList.toggle('active', faults.some(f => f.site === Number(b.dataset.site))));
}

// ============================================================================
// Error control
// ============================================================================
async function clearErrors() {
  try {
    await fetch(BASE + '/api/faults/clear', { method: 'POST' });
    toast('Errors cleared');
    refresh();
  } catch(e) { toast('Error: ' + e.message, true); }
}

// ============================================================================
// Playback (browser-driven — no device memory needed)
// ============================================================================
let pbEntries = [];      // parsed capture entries
let pbIndex = 0;         // current entry
let pbBaseTs = 0;        // first entry's timestamp
let pbStartTime = 0;     // performance.now() when playback started
let pbTimer = null;      // setTimeout handle
let pbFileName = '';

function onCaptureFile(input) {
  const file = input.files[0];
  if (!file) return;
  pbFileName = file.name;
  const reader = new FileReader();
  reader.onload = () => {
    const lines = reader.result.split('\n').filter(l => l.trim());
    pbEntries = [];
    for (const line of lines) {
      try { pbEntries.push(JSON.parse(line)); } catch(e) {}
    }
    if (pbEntries.length === 0) {
      toast('No valid entries found', true);
      return;
    }
    pbBaseTs = pbEntries[0].t || 0;
    document.getElementById('playback-state').textContent = `loaded (${pbEntries.length} entries)`;
    document.getElementById('playback-info').textContent = `${file.name} — ${pbEntries.length} entries ready`;
    document.getElementById('play-btn').disabled = false;
    document.getElementById('stop-btn').disabled = false;
    toast(`Parsed ${pbEntries.length} entries from ${file.name}`);
  };
  reader.onerror = () => toast('Failed to read file', true);
  reader.readAsText(file);
}

function togglePlayback() {
  if (pbTimer) { pausePlayback(); return; }
  startPlayback();
}

async function startPlayback() {
  if (pbEntries.length === 0) { toast('Browse for a capture file first', true); return; }
  // Disable simulation so captured STATUS_2 / input registers are preserved
  try { await fetch(BASE + '/api/simulation', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{"enabled":false}' }); } catch(e) {}
  pbIndex = 0;
  pbStartTime = performance.now();
  document.getElementById('play-btn').textContent = '⏸ Pause';
  toast('Playback started (simulation disabled)');
  scheduleNext();
}

function pausePlayback() {
  if (pbTimer) { clearTimeout(pbTimer); pbTimer = null; }
  document.getElementById('play-btn').textContent = '▶ Resume';
  document.getElementById('playback-state').textContent =
    `paused (${pbIndex}/${pbEntries.length})`;
  toast('Playback paused');
}

async function stopPlayback() {
  if (pbTimer) { clearTimeout(pbTimer); pbTimer = null; }
  pbIndex = 0;
  // Re-enable simulation engine
  try { await fetch(BASE + '/api/simulation', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{"enabled":true}' }); } catch(e) {}
  document.getElementById('play-btn').textContent = '▶ Play';
  document.getElementById('playback-state').textContent =
    pbEntries.length ? `loaded (${pbEntries.length} entries)` : 'idle';
  toast('Playback stopped (simulation enabled)');
}

function scheduleNext() {
  if (pbIndex >= pbEntries.length) {
    document.getElementById('play-btn').textContent = '▶ Play';
    document.getElementById('playback-state').textContent = 'complete';
    toast('Playback complete');
    pbTimer = null;
    // Re-enable simulation engine
    fetch(BASE + '/api/simulation', { method:'POST', headers:{'Content-Type':'application/json'}, body:'{"enabled":true}' }).catch(()=>{});
    return;
  }
  const entry = pbEntries[pbIndex];
  const relMs = (entry.t || 0) - pbBaseTs;
  const elapsed = performance.now() - pbStartTime;
  const delay = Math.max(0, relMs - elapsed);
  pbTimer = setTimeout(() => applyEntry(), delay);
}

async function applyEntry() {
  pbTimer = null;
  // Batch consecutive entries with the same timestamp
  const batchTs = pbEntries[pbIndex].t;
  const regs = {};
  while (pbIndex < pbEntries.length && pbEntries[pbIndex].t === batchTs) {
    const e = pbEntries[pbIndex];
    if (e.values) {
      for (let i = 0; i < e.values.length; i++) {
        regs[String((e.addr || 0) + i)] = e.values[i];
      }
    } else if (e.value !== undefined) {
      regs[String(e.addr || 0)] = e.value;
    }
    pbIndex++;
  }
  // Send bulk register write
  try {
    await fetch(BASE + '/api/registers/bulk', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ registers: regs })
    });
  } catch(e) { /* keep going */ }
  document.getElementById('playback-state').textContent =
    `playing (${pbIndex}/${pbEntries.length})`;
  scheduleNext();
}

// ============================================================================
// SSE Stream
// ============================================================================
let streamSource = null;
let streamLines = [];
let streamBytes = 0;
let streamStartTime = null;
let streamTimer = null;

function toggleStream() {
  if (streamSource) stopStream(); else startStream();
}

function startStream() {
  if (streamSource) return;
  streamLines = [];
  streamBytes = 0;
  streamStartTime = Date.now();
  streamSource = new EventSource(BASE + '/api/stream');
  streamSource.onmessage = function(e) {
    streamLines.push(e.data);
    streamBytes += e.data.length + 1;
    updateStreamUI();
  };
  streamSource.onerror = function() {
    streamSource.close();
    streamSource = null;
    if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
    updateStreamUI();
    if (streamLines.length === 0) toast('Stream disconnected', true);
  };
  streamTimer = setInterval(updateStreamUI, 1000);
  updateStreamUI();
  toast('Streaming started');
}

function stopStream() {
  if (streamSource) { streamSource.close(); streamSource = null; }
  if (streamTimer) { clearInterval(streamTimer); streamTimer = null; }
  fetch(BASE + '/api/stream/stop', { method: 'POST' }).catch(() => {});
  updateStreamUI();
}

function downloadStreamData() {
  if (streamLines.length === 0) { toast('No data to download', true); return; }
  const blob = new Blob([streamLines.join('\\n') + '\\n'], { type: 'application/x-ndjson' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'capture.jsonl';
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function clearStreamData() {
  streamLines = [];
  streamBytes = 0;
  updateStreamUI();
  toast('Stream buffer cleared');
}

function updateStreamUI() {
  const btn = document.getElementById('stream-toggle');
  const active = !!streamSource;
  btn.textContent = active ? '⏹ Stop' : '📡 Stream';
  btn.classList.toggle('recording', active);
  const info = document.getElementById('stream-info');
  if (active) {
    const elapsed = Math.round((Date.now() - streamStartTime) / 1000);
    const min = Math.floor(elapsed / 60);
    const sec = elapsed % 60;
    const kb = (streamBytes / 1024).toFixed(1);
    info.textContent = 'Streaming \u2014 ' + streamLines.length + ' entries, ' + kb + ' KB, ' + min + ':' + (sec < 10 ? '0' : '') + sec + ' elapsed';
  } else if (streamLines.length > 0) {
    const kb = (streamBytes / 1024).toFixed(1);
    info.textContent = 'Stopped \u2014 ' + streamLines.length + ' entries, ' + kb + ' KB';
  } else {
    info.textContent = 'Stream register data in real-time to your browser';
  }
}

// ============================================================================
// Toast
// ============================================================================
function toast(msg, isError) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast show ' + (isError ? 'err' : 'ok');
  setTimeout(() => el.className = 'toast', 2000);
}

// ============================================================================
// System
// ============================================================================
async function rebootDevice() {
  if (!confirm('Reboot the simulator device?')) return;
  try {
    await fetch(BASE + '/api/reboot', { method: 'POST' });
    toast('Rebooting…');
  } catch(e) { toast('Error: ' + e.message, true); }
}

// ============================================================================
// Init
// ============================================================================
loadCatalog().then(refresh);
setInterval(refresh, 2000);
</script>
